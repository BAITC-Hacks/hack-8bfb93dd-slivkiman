{% extends "base.html" %}

{% block title %}Describe a Task | Task Catalog MVP{% endblock %}

{% block content %}
<section class="card">
    <h1>Describe your task</h1>
    <p>Write a rough description. You can include as much or as little detail as you have.</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('clarify_task') }}">
        <label for="description">Business need</label>
        <textarea id="description" name="description" rows="8" required placeholder="For example: We need a simple way to collect customer feedback after a purchase."></textarea>
        <button type="submit">Submit description</button>
    </form>
</section>
{% endblock %}
